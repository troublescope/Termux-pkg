name: Weekly Termux aarch64 Wrangler build

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      wrangler_version:
        description: "Wrangler version ('latest' for npm latest, 'pinned' for 4.123.0, or specific version)"
        required: false
        default: "latest"
        type: string
      force_rebuild:
        description: "Force rebuild workerd from source even if prebuilt exists"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build and test only; do not publish release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: termux-wrangler-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wrangler:
    name: Wrangler / Android aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Resolve stable Wrangler and matching native dependencies
        id: versions
        env:
          INPUT_VERSION: ${{ inputs.wrangler_version || 'latest' }}
        run: |
          set -Eeuo pipefail
          if [[ "$INPUT_VERSION" == "pinned" || -z "$INPUT_VERSION" ]]; then
            wrangler="4.123.0"
            workerd="1.20260811.1"
            esbuild="0.28.1"
            node_version="22.15.0"
            pnpm_version="10.33.0"
          elif [[ "$INPUT_VERSION" == "latest" ]]; then
            wrangler=$(curl -fsSL --retry 4 --retry-all-errors \
              https://registry.npmjs.org/wrangler/latest | jq -r .version)
            test -n "$wrangler" -a "$wrangler" != null
          else
            wrangler="$INPUT_VERSION"
          fi

          if [[ "$INPUT_VERSION" != "pinned" && -n "${wrangler:-}" && "$wrangler" != "4.123.0" ]]; then
            for attempt in 1 2 3 4 5; do
              if git clone --filter=blob:none --depth=1 --branch "wrangler@$wrangler" \
                https://github.com/cloudflare/workers-sdk.git workers-sdk; then
                break
              fi
              rm -rf workers-sdk
              if [[ "$attempt" == 5 ]]; then
                echo "workers-sdk tag wrangler@$wrangler was not available after retries" >&2
                exit 1
              fi
              sleep 10
            done
            workerd=$(sed -n 's/^  workerd: "\([^"]*\)"/\1/p' workers-sdk/pnpm-workspace.yaml | head -n1)
            esbuild=$(sed -n 's/^  esbuild: "\([^"]*\)"/\1/p' workers-sdk/pnpm-workspace.yaml | head -n1)
            node_version=$(jq -r '.volta.node' workers-sdk/package.json)
            pnpm_version=$(jq -r '.packageManager' workers-sdk/package.json | sed 's/^pnpm@//')
          elif [[ "$INPUT_VERSION" == "pinned" || "$wrangler" == "4.123.0" ]]; then
            for attempt in 1 2 3 4 5; do
              if git clone --filter=blob:none --depth=1 --branch "wrangler@$wrangler" \
                https://github.com/cloudflare/workers-sdk.git workers-sdk; then
                break
              fi
              rm -rf workers-sdk
              if [[ "$attempt" == 5 ]]; then
                echo "workers-sdk tag wrangler@$wrangler was not available after retries" >&2
                exit 1
              fi
              sleep 10
            done
          fi
          test -n "$workerd" -a -n "$esbuild" -a -n "$node_version" -a -n "$pnpm_version"
          printf 'wrangler=%s\nworkerd=%s\nesbuild=%s\nnode=%s\npnpm=%s\n' \
            "$wrangler" "$workerd" "$esbuild" "$node_version" "$pnpm_version"
          echo "wrangler=$wrangler" >> "$GITHUB_OUTPUT"
          echo "workerd=$workerd" >> "$GITHUB_OUTPUT"
          echo "esbuild=$esbuild" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"

      - name: Set up matching Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Build matching esbuild from source for host and Android
        env:
          ESBUILD_VERSION: ${{ steps.versions.outputs.esbuild }}
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch "v$ESBUILD_VERSION" \
            https://github.com/evanw/esbuild.git esbuild-src
          mkdir -p host-tools native
          (
            cd esbuild-src
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -o ../host-tools/esbuild ./cmd/esbuild
            CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
              go build -trimpath -o ../native/esbuild ./cmd/esbuild
          )
          test "$(host-tools/esbuild --version)" = "$ESBUILD_VERSION"
          file native/esbuild

      - name: Build Wrangler workspace from source
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
          ESBUILD_VERSION: ${{ steps.versions.outputs.esbuild }}
          NODE_ENV: production
          CI_OS: Linux
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -Eeuo pipefail
          npm install --global "pnpm@$PNPM_VERSION"
          cd workers-sdk
          pnpm --filter="wrangler..." install --frozen-lockfile --ignore-scripts

          cd "$GITHUB_WORKSPACE"
          mapfile -t esbuild_versions < <(
            find workers-sdk/node_modules/.pnpm \
              -path '*/node_modules/esbuild/package.json' -type f -print0 |
              xargs -0 -r -n1 jq -r .version | sort -Vu
          )
          ((${#esbuild_versions[@]} > 0)) || {
            echo 'No esbuild versions found in the filtered Wrangler dependency graph' >&2
            exit 1
          }
          printf 'Filtered Wrangler graph esbuild versions: %s\n' "${esbuild_versions[*]}"

          for version in "${esbuild_versions[@]}"; do
            if [[ "$version" == "$ESBUILD_VERSION" ]]; then
              binary="$GITHUB_WORKSPACE/host-tools/esbuild"
            else
              src="$RUNNER_TEMP/esbuild-src-$version"
              rm -rf "$src"
              git clone --filter=blob:none --depth=1 --branch "v$version" \
                https://github.com/evanw/esbuild.git "$src"
              binary="$RUNNER_TEMP/esbuild-$version"
              (
                cd "$src"
                CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                  go build -trimpath -o "$binary" ./cmd/esbuild
              )
            fi
            test "$("$binary" --version)" = "$version"

            mapfile -t targets < <(
              find workers-sdk/node_modules/.pnpm \
                -path "*/@esbuild+linux-x64@$version/node_modules/@esbuild/linux-x64/bin/esbuild" \
                -type f
            )
            ((${#targets[@]} > 0)) || {
              echo "No installed @esbuild/linux-x64 target for $version" >&2
              exit 1
            }
            for target in "${targets[@]}"; do
              install -m 0755 "$binary" "$target"
              test "$("$target" --version)" = "$version"
            done
          done

          cd workers-sdk
          pnpm --filter="wrangler..." build
          pnpm --filter=wrangler deploy "$GITHUB_WORKSPACE/wrangler-deploy" \
            --prod --legacy --no-optional --ignore-scripts

      - name: Verify portable Wrangler deployment and free build-only files
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from scripts.package_wrangler_android import (
              normalize_pnpm_bin_shims,
              normalize_termux_shebangs,
              normalize_wrangler_self_link,
              reject_platform_native_packages,
              remove_foreign_native_payloads,
              verify_self_contained,
          )

          root = Path("wrangler-deploy").resolve()
          assert (root / "package.json").is_file()
          assert (root / "bin" / "wrangler.js").is_file()
          assert (root / "bin" / "cf-wrangler.js").is_file()
          assert (root / "node_modules" / "workerd" / "lib" / "main.js").exists()
          normalize_wrangler_self_link(root)
          normalize_pnpm_bin_shims(root)
          normalize_termux_shebangs(root)
          remove_foreign_native_payloads(root)
          reject_platform_native_packages(root)
          verify_self_contained(root)
          PY
          store=$(pnpm store path 2>/dev/null || true)
          rm -rf workers-sdk esbuild-src host-tools \
            "$RUNNER_TEMP"/esbuild-src-* "$RUNNER_TEMP"/esbuild-*
          if [[ -n "$store" ]]; then rm -rf "$store"; fi
          df -h .

      - name: Check for prebuilt workerd release
        id: prebuilt-workerd
        env:
          WORKERD_VERSION: ${{ steps.versions.outputs.workerd }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p native
          found="false"
          if [[ "$FORCE_REBUILD" != "true" ]]; then
            pattern="workerd-${WORKERD_VERSION}-android-arm64.tar.gz"
            echo "Checking GitHub Releases for matching $pattern..."
            if gh release download --repo "$GITHUB_REPOSITORY" --pattern "$pattern" --dir /tmp/prebuilt-workerd 2>/dev/null; then
              if [[ -f "/tmp/prebuilt-workerd/$pattern" ]]; then
                echo "Found prebuilt workerd! Extracting..."
                tar -xzf "/tmp/prebuilt-workerd/$pattern" -C native
                if [[ -x "native/workerd" ]]; then
                  echo "Prebuilt workerd successfully restored!"
                  found="true"
                fi
              fi
            fi
          else
            echo "force_rebuild requested; skipping prebuilt release check"
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Clone and patch matching workerd source
        if: steps.prebuilt-workerd.outputs.found != 'true'
        env:
          WORKERD_VERSION: ${{ steps.versions.outputs.workerd }}
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch "v$WORKERD_VERSION" \
            https://github.com/cloudflare/workerd.git workerd
          python3 scripts/patch_workerd_android.py workerd
          grep -Fx 'build:android --repo_env=CC=/usr/lib/llvm-19/bin/clang' workerd/.bazelrc
          grep -Fx 'build:android --host_linkopt=--ld-path=/usr/lib/llvm-19/bin/ld.lld' workerd/.bazelrc
          grep -Fx 'build:android --host_linkopt=-latomic' workerd/.bazelrc
          if [[ -f workerd/src/pyodide/helpers.bzl ]]; then
            grep -F 'use_execroot_entry_point = False' workerd/src/pyodide/helpers.bzl
          fi
          if [[ -f workerd/src/rust/cxx/kj-hyper/tls.rs ]]; then
            grep -F 'target_os = "android"' workerd/src/rust/cxx/kj-hyper/tls.rs
          fi
          if grep -q -F 'name = "rust_cc_common_link"' workerd/build/config/BUILD.bazel; then
            grep -A4 -F 'name = "rust_cc_common_link"' workerd/build/config/BUILD.bazel \
              | grep -F 'constraint_values = ["@platforms//os:android"]'
          else
            grep -F 'experimental_use_cc_common_link = 1,' workerd/build/wd_rust_binary.bzl
          fi

      - name: Install workerd host LLVM 19 toolchain
        if: steps.prebuilt-workerd.outputs.found != 'true'
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL --retry 4 --retry-all-errors https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sed -i '/apt-get install/d' /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          sudo apt-get install -y -qq --no-install-recommends \
            clang-19 \
            lld-19 \
            libunwind-19 \
            libc++abi1-19 \
            libc++1-19 \
            libc++-19-dev \
            libclang-rt-19-dev \
            llvm-19
          /usr/lib/llvm-19/bin/clang --version
          /usr/lib/llvm-19/bin/ld.lld --version
          /usr/lib/llvm-19/bin/llvm-ar --version
          libatomic=$(/usr/lib/llvm-19/bin/clang --print-file-name=libatomic.so)
          test "$libatomic" != libatomic.so
          test -e "$libatomic"
          printf 'host libatomic: %s\n' "$libatomic"

      - name: Enable aarch64 containers through QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Select Android NDK and Bazelisk
        if: steps.prebuilt-workerd.outputs.found != 'true'
        run: |
          set -Eeuo pipefail
          test -x /usr/lib/llvm-19/bin/clang
          test -x /usr/lib/llvm-19/bin/ld.lld
          test -x /usr/lib/llvm-19/bin/llvm-ar
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ndk_prebuilt=$(find "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$ndk_prebuilt"
          builtins=$(find "$ndk_prebuilt" -type f \
            -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)
          test -n "$builtins"
          test -f "$builtins"
          test -x "$ndk_prebuilt/bin/llvm-nm"
          "$ndk_prebuilt/bin/llvm-nm" --defined-only "$builtins" \
            | grep -E '(^|[[:space:]])__clear_cache$'
          printf 'Android compiler-rt builtins: %s\n' "$builtins"
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version
          export CCACHE_DIR=/home/runner/.cache/ccache
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          GOBIN="$HOME/.local/bin" go install github.com/bazelbuild/bazelisk@latest

      - name: Cache compiler ccache objects
        if: steps.prebuilt-workerd.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ runner.os }}-${{ steps.versions.outputs.workerd }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.versions.outputs.workerd }}-
            ccache-${{ runner.os }}-

      - name: Prepare Android build-time target runner
        if: steps.prebuilt-workerd.outputs.found != 'true'
        run: |
          set -Eeuo pipefail
          sudo install -m 0755 scripts/run_workerd_android_target_tool.sh /usr/local/bin/workerd-android-run-under
          docker pull --platform linux/arm64 termux/termux-docker:aarch64
          docker run --rm --platform linux/arm64 termux/termux-docker:aarch64 /entrypoint.sh bash -lc '
            test "$(uname -m)" = aarch64
            test "$PREFIX" = /data/data/com.termux/files/usr
            echo qemu-termux-preflight-ok
          '

      - name: Cache Bazel compilation objects
        if: steps.prebuilt-workerd.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/bazel-disk
          key: bazel-disk-${{ steps.versions.outputs.workerd }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ steps.versions.outputs.workerd }}-
            bazel-disk-

      - name: Build matching workerd from source for Android aarch64
        if: steps.prebuilt-workerd.outputs.found != 'true'
        working-directory: workerd
        run: |
          set -Eeuo pipefail
          mkdir -p /home/runner/.cache/bazel-disk
          "$HOME/.local/bin/bazelisk" build //src/workerd/server:workerd \
            --enable_platform_specific_config=false \
            --config=release_android \
            --platforms=//:android_arm64 \
            --disk_cache=/home/runner/.cache/bazel-disk \
            --jobs=4 \
            --verbose_failures

      - name: Verify Android native binaries
        run: |
          set -Eeuo pipefail
          if [[ -f workerd/bazel-bin/src/workerd/server/workerd ]]; then
            cp workerd/bazel-bin/src/workerd/server/workerd native/workerd
          fi
          chmod +x native/workerd native/esbuild
          file native/workerd native/esbuild
          for binary in native/workerd native/esbuild; do
            readelf -h "$binary" | grep -E 'Machine:[[:space:]]+AArch64'
            readelf -l "$binary" | grep -F '/system/bin/linker64'
            if readelf -d "$binary" 2>/dev/null | grep -F 'libc.so.6'; then
              echo "glibc dependency detected in $binary; refusing non-Android artifact" >&2
              exit 1
            fi
            if readelf -l "$binary" | grep -E 'ld-linux|ld-musl'; then
              echo "non-Android ELF interpreter detected in $binary" >&2
              exit 1
            fi
          done
          sha256sum native/workerd native/esbuild
          rm -rf workerd
          sudo chown -R runner:docker "$HOME/.cache" /home/runner/.cache 2>/dev/null || true
          df -h .

      - name: Assemble Wrangler Termux package
        env:
          WRANGLER_VERSION: ${{ steps.versions.outputs.wrangler }}
          WORKERD_VERSION: ${{ steps.versions.outputs.workerd }}
          ESBUILD_VERSION: ${{ steps.versions.outputs.esbuild }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          python3 scripts/package_wrangler_android.py \
            --deploy wrangler-deploy \
            --workerd-binary native/workerd \
            --esbuild-binary native/esbuild \
            --wrangler-version "$WRANGLER_VERSION" \
            --workerd-version "$WORKERD_VERSION" \
            --esbuild-version "$ESBUILD_VERSION" \
            --output-dir dist
          dpkg-deb -f "dist/wrangler_${WRANGLER_VERSION}_aarch64.deb" Package Version Architecture Depends
          tar -czf "dist/workerd-${WORKERD_VERSION}-android-arm64.tar.gz" -C native workerd
          tar -czf "dist/esbuild-${ESBUILD_VERSION}-android-arm64.tar.gz" -C native esbuild

      - name: Save build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wrangler-aarch64
          path: |
            dist/wrangler_*_aarch64.deb
            dist/workerd-*.tar.gz
            dist/esbuild-*.tar.gz
            native/workerd
            native/esbuild
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Test Wrangler and a real local Worker in aarch64 Termux
        env:
          WRANGLER_VERSION: ${{ steps.versions.outputs.wrangler }}
        run: |
          set -Eeuo pipefail
          chmod -R a+rX dist
          docker run --rm --platform linux/arm64 \
            --security-opt seccomp=unconfined \
            -v "$PWD:/work" \
            termux/termux-docker:aarch64 \
            /entrypoint.sh bash /work/scripts/test_wrangler_termux.sh \
            "/work/dist/wrangler_${WRANGLER_VERSION}_aarch64.deb" \
            "$WRANGLER_VERSION" \
            "${{ steps.versions.outputs.workerd }}" \
            "${{ steps.versions.outputs.esbuild }}"

  publish:
    name: Publish immutable weekly release
    needs: [build-wrangler]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && !(inputs.dry_run || false) && needs.build-wrangler.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download successful Wrangler artifact
        uses: actions/download-artifact@v7
        with:
          pattern: wrangler-aarch64
          path: dist
          merge-multiple: true

      - name: Select immutable release tag
        id: release
        run: |
          build_date=$(date -u +%Y%m%d)
          tag="termux-aarch64-${build_date}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Generate release indexes and checksums
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test -d dist
          test -n "$(find dist -maxdepth 1 -type f -name 'wrangler_*_aarch64.deb' -print -quit)"
          rm -f dist/SHA256SUMS-*.build
          python3 scripts/generate_release_index.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --assets dist \
            --output dist

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "# Native Termux aarch64 Wrangler build"
            echo
            echo "Immutable release tag: \`$RELEASE_TAG\`"
            echo
            echo "Cloudflare Wrangler, workerd, and esbuild are built from their matching upstream source revisions for Android aarch64."
            echo "Every install is SHA-256 verified by install.sh."
            echo
            echo "## Assets"
            echo
            awk -F '\t' 'NR > 1 { printf "- `%s` — %s %s (%s)\n", $5, $1, $3, $2 }' \
              dist/release-index.tsv
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f \
            \( -name '*.deb' -o -name 'release-index.*' -o -name 'SHA256SUMS' -o -name '*.tar.gz' \) \
            -print | sort)
          # Immutable releases lock the tag and assets at publication. Build the
          # complete release as a draft, upload every asset, then publish once.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Termux aarch64 weekly Wrangler build ${{ steps.release.outputs.date }}" \
            --notes-file release-notes.md \
            --draft
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
